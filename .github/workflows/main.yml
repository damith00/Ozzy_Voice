name: Build OZZY VOICE APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o OzzyVoice_v2_Android_Project.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: project/OzzyVoice_v2
        run: |
          chmod +x gradlew || true
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OZZY-VOICE-APK
          path: project/OzzyVoice_v2/app/build/outputs/apk/debug/app-debug.apk
